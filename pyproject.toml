[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organiser"
version = "0.1.0"
description = "Local Organiser: persistent context, knowledge, tasks and reviewable model actions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "httpx>=0.28,<1.0",
    "caldav>=1.3,<2.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
# PDF-Extraktion laeuft in einem isolierten Subprozess und braucht pypdf. Die
# Abhaengigkeit ist bewusst optional: ohne sie meldet eine PDF "unsupported"
# (pdf_dependency_missing), statt dass der ganze Dienst beim Import scheitert.
pdf = [
    "pypdf>=6.0,<7.0",
]
# Die Testumgebung installiert die PDF-Abhaengigkeit mit, damit der
# PDF-Pfad in CI und lokal wirklich getestet wird.
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.17,<0.18",
    "coverage[toml]>=7.0,<8.0",
    "pypdf>=6.0,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["organiser"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["migrations", "docs/agent", "docs/maintenance", "organiser-spec", "docs/architecture/WORKSPACE_*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Existing intentional setup variables are reviewed manually; do not delete them mechanically.
ignore = ["F841"]
